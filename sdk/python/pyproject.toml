[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-public-mock"
version = "0.2.0"
description = "Offline deterministic SKYNET public developer SDK"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
skynet-public = "skynet_public.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skynet_public*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
